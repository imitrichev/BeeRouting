services:

  nominatim:
    image: mediagis/nominatim:5.3
    container_name: nominatim

    ports:
      - "8080:8080"

    environment:
      PBF_PATH: /nominatim/data/moscow-region.osm.pbf
      IMPORT_STYLE: address
      IMPORT_WIKIPEDIA: "false"
      UPDATE_MODE: none
      NOMINATIM_PASSWORD: nominatim

      THREADS: 4
      POSTGRES_SHARED_BUFFERS: 1GB
      POSTGRES_MAINTENANCE_WORK_MEM: 2GB
      POSTGRES_AUTOVACUUM_WORK_MEM: 512MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 4GB

    volumes:
      - ./osm:/nominatim/data
      - nominatim-db:/var/lib/postgresql/16/main

    shm_size: 1gb
    restart: unless-stopped

volumes:
  nominatim-db:
